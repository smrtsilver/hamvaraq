{% extends "base.html" %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<div class="narrow card">
    <h1>رمز تازه</h1>
    {% if validlink %}<form method="post" novalidate>{% csrf_token %}{% include "components/form.html" %}<button class="btn btn-block">ذخیره‌ی رمز</button></form>
    {% else %}<div class="alert alert-error"><p>این لینک نامعتبره یا منقضی شده. دوباره درخواست بده.</p></div><a class="btn btn-secondary" href="{% url 'accounts:password_reset' %}">درخواست دوباره</a>{% endif %}
</div>
{% endblock %}
