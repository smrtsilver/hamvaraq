{% extends "base.html" %}
{% block title %}{{ title }} | هم‌ورق{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<div class="narrow"><div class="page-head"><div><h1>{{ title }}</h1><p>یه اسم خوب، کتابی که می‌خونید و یه توضیح کوتاه کافیه.</p></div></div>
<form method="post" class="card" data-location-group novalidate>{% csrf_token %}{% include "components/form.html" %}
    <div class="form-actions"><button class="btn btn-lg">{% include "components/icon.html" with name="check" %} ذخیره</button><a class="btn btn-ghost" href="{% if club %}{{ club.get_absolute_url }}{% else %}{% url 'clubs:list' %}{% endif %}">انصراف</a></div></form></div>
{% endblock %}
