{% if rep.newcomer %}<span class="pill rep" title="هنوز رأی نگرفته">{% include "components/icon.html" with name="sparkle" %} تازه‌وارد</span>
{% else %}<span class="pill rep {% if rep.low %}pill-red{% else %}pill-green{% endif %}" title="درصد لایک از کل رأی‌ها">{% include "components/icon.html" with name="star" %} {{ rep.percent|fa }}٪ از {{ rep.total|fa }} مبادله</span>{% if rep.low %} <span class="pill pill-red">اعتبار پایین</span>{% endif %}{% endif %}
